<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minecraft 서버 플레이 시간 순위</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, "Noto Sans KR", sans-serif;
    background: #0f1115;
    color: #f1f3f5;
}

.container {
    max-width: 760px;
    margin: 0 auto;
    padding: 45px 20px 60px;
}

.header {
    text-align: center;
    margin-bottom: 35px;
}

.header h1 {
    margin: 0;
    font-size: 32px;
    font-weight: 800;
}

.header p {
    margin-top: 10px;
    color: #9da3ae;
    font-size: 14px;
}

.rank {
    display: flex;
    align-items: center;
    gap: 18px;
    background: #181b21;
    border: 1px solid #292e38;
    border-radius: 16px;
    padding: 18px 20px;
    margin-bottom: 12px;
    transition: transform .15s, background .15s;
}

.rank:hover {
    transform: translateY(-2px);
    background: #1d2129;
}

.number {
    width: 42px;
    text-align: center;
    font-size: 22px;
    font-weight: 800;
}

.info {
    flex: 1;
}

.name {
    font-size: 17px;
    font-weight: 700;
}

.owner {
    display: inline-block;
    margin-left: 7px;
    padding: 3px 7px;
    border-radius: 6px;
    background: #303640;
    color: #b9c0ca;
    font-size: 11px;
    vertical-align: middle;
}

.time {
    margin-top: 5px;
    color: #aeb5c0;
    font-size: 14px;
}

.first {
    border: 1px solid #b99a3b;
    background: linear-gradient(135deg, #211e16, #181b21);
}

.second {
    border: 1px solid #777d87;
}

.third {
    border: 1px solid #8c6048;
}

.footer {
    text-align: center;
    margin-top: 35px;
    color: #666d78;
    font-size: 12px;
}

@media (max-width: 500px) {
    .container {
        padding: 30px 14px 45px;
    }

    .header h1 {
        font-size: 25px;
    }

    .rank {
        padding: 16px;
        gap: 12px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>⛏️ Minecraft 서버 플레이 시간 순위</h1>
        <p>2026년 8월 30일 14시 40분 기준</p>
    </div>

    <div class="rank first">
        <div class="number">🥇</div>
        <div class="info">
            <div class="name">kim1111434</div>
            <div class="time">12시간 11분 35초</div>
        </div>
    </div>

    <div class="rank second">
        <div class="number">🥈</div>
        <div class="info">
            <div class="name">
                baekdoo
                <span class="owner">서버 주인</span>
            </div>
            <div class="time">11시간 26분 45초</div>
        </div>
    </div>

    <div class="rank third">
        <div class="number">🥉</div>
        <div class="info">
            <div class="name">.TaTa95v</div>
            <div class="time">6시간 35분 59초</div>
        </div>
    </div>

    <div class="rank">
        <div class="number">4</div>
        <div class="info">
            <div class="name">.WeekendTY</div>
            <div class="time">6시간 05분 19초</div>
        </div>
    </div>

    <div class="rank">
        <div class="number">5</div>
        <div class="info">
            <div class="name">.SideBloom557332</div>
            <div class="time">5시간 37분 51초</div>
        </div>
    </div>

    <div class="rank">
        <div class="number">6</div>
        <div class="info">
            <div class="name">.SageSubset83892</div>
            <div class="time">2시간 07분 29초</div>
        </div>
    </div>

    <div class="rank">
        <div class="number">7</div>
        <div class="info">
            <div class="name">.Junhun1011</div>
            <div class="time">0시간 27분 16초</div>
        </div>
    </div>

    <div class="footer">
        Minecraft Server Statistics
    </div>

</div>

</body>
</html>
