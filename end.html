<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>서버 종료 까지</title>
<style>
* {
    box-sizing: border-box;
}
body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: white;
    background:
        radial-gradient(circle at 20% 20%, #3949ab55, transparent 35%),
        radial-gradient(circle at 80% 80%, #7c4dff44, transparent 35%),
        linear-gradient(135deg, #080b16, #11162a);
}
.container {
    width: min(90%, 650px);
    padding: 45px 30px;
    text-align: center;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 30px;
    background: rgba(255,255,255,0.07);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow:
        0 25px 80px rgba(0,0,0,0.45),
        inset 0 1px rgba(255,255,255,0.08);
}
.icon {
    font-size: 42px;
    margin-bottom: 12px;
}
h1 {
    margin: 0;
    font-size: clamp(24px, 6vw, 38px);
}
.subtitle {
    margin-top: 10px;
    color: #aeb5ca;
    font-size: 15px;
}
#timer {
    margin-top: 35px;
    font-size: clamp(55px, 14vw, 100px);
    font-weight: 800;
    letter-spacing: 3px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    background: linear-gradient(
        90deg,
        #ffffff,
        #b8c7ff,
        #ffffff
    );
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 35px rgba(130,150,255,0.25);
}
.labels {
    display: flex;
    justify-content: center;
    gap: clamp(35px, 10vw, 75px);
    margin-top: 12px;
    color: #858da5;
    font-size: 12px;
    letter-spacing: 2px;
}
.progress {
    height: 5px;
    margin: 30px auto 0;
    max-width: 450px;
    overflow: hidden;
    border-radius: 10px;
    background: rgba(255,255,255,0.08);
}
#bar {
    height: 100%;
    width: 0%;
    border-radius: inherit;
    background: linear-gradient(
        90deg,
        #667eea,
        #9f7aea
    );
    transition: width 1s linear;
}
.target {
    display: inline-block;
    margin-top: 35px;
    padding: 9px 17px;
    border-radius: 999px;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.08);
    color: #b8c0d8;
    font-size: 13px;
}
</style>
</head>
<body>
<div class="container">
    <div class="icon">🌙</div>
    <h1>MCSMP 종료까지</h1>
    <div class="subtitle" id="message">
        서버 종료까지 남은 시간입니다.
    </div>
    <div id="timer">00:00:00</div>
    <div class="labels">
        <span>시간</span>
        <span>분</span>
        <span>초</span>
    </div>
    <div class="progress">
        <div id="bar"></div>
    </div>
    <div class="target">
        🎯 MCSMP 종료까지
    </div>
</div>
<script>
function updateCountdown() {
    const now = new Date();
    // 오늘 저녁 8시
    const target = new Date();
    target.setHours(20, 0, 0, 0);
    const start = new Date(target);
    start.setHours(0, 0, 0, 0);
    let diff = target - now;
    if (diff < 0) {
        diff = 0;
    }
    const totalSeconds = Math.ceil(diff / 1000);
    const hours = Math.floor(
        diff / (1000 * 60 * 60)
    );
    const minutes = Math.floor(
        (diff / (1000 * 60)) % 60
    );
    const seconds = Math.floor(
        (diff / 1000) % 60
    );
    document.getElementById("timer").textContent =
        String(hours).padStart(2, "0") + ":" +
        String(minutes).padStart(2, "0") + ":" +
        String(seconds).padStart(2, "0");
    const message = document.getElementById("message");
    // 10초 이하
    if (totalSeconds <= 10 && totalSeconds > 0) {
        message.textContent = "그동안 이용해주셔서 감사합니다. 10월 2일날 봐요!";
    }
    // 8시 도착
    else if (diff === 0) {
        document.getElementById("timer").textContent = "20:00!";
        message.textContent = "서버 종료. 이용해주셔서 감사합니다!";
    }
    // 평상시
    else {
        message.textContent = "서버 종료까지 남은 시간입니다";
    }
    // 진행률
    const total = target - start;
    const elapsed = now - start;
    let progress = (elapsed / total) * 100;
    progress = Math.max(
        0,
        Math.min(100, progress)
    );
    document.getElementById("bar").style.width =
        progress + "%";
}
updateCountdown();
setInterval(updateCountdown, 1000);
</script>
</body>
</html>
