<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이름 궁합</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #ffeef5;
        text-align: center;
        padding: 50px 20px;
    }

    .box {
        max-width: 400px;
        margin: auto;
        background: white;
        padding: 30px;
        border-radius: 20px;
        box-shadow: 0 5px 20px #0002;
    }

    h1 {
        color: #ff4f8b;
    }

    input {
        width: 85%;
        padding: 13px;
        margin: 8px;
        border: 1px solid #ddd;
        border-radius: 10px;
        font-size: 16px;
        box-sizing: border-box;
    }

    button {
        margin-top: 15px;
        padding: 13px 30px;
        border: none;
        border-radius: 10px;
        background: #ff4f8b;
        color: white;
        font-size: 16px;
        cursor: pointer;
    }

    #result {
        display: none;
        margin-top: 25px;
        padding: 18px;
        background: #fff5f8;
        border: 1px solid #ffc5d8;
        border-radius: 12px;
        text-align: left;
        white-space: pre-line;
        line-height: 1.7;
    }
</style>
</head>

<body>

<div class="box">
    <h1>💕 이름 궁합 테스트</h1>
    <p>두 사람의 이름을 입력해 보세요!</p>

    <input id="name1" type="text" placeholder="첫 번째 이름">
    <input id="name2" type="text" placeholder="두 번째 이름">

    <br>

    <button onclick="showResult()">궁합 보기</button>

    <div id="result">
        금서윤 ❤️ ㅇㅈㅎ
        
        금서윤 ❤️ ㅇㅅㅈ
        
        금서윤 ❤️ ㄱㄱㅁ
        
        금서윤 ❤️ ㅈㅇㅎ

        금서윤 ❤️ ㅇㅁㅎ
    </div>
</div>

<script>
function showResult() {
    document.getElementById("result").style.display = "block";
}
</script>

</body>
</html>
