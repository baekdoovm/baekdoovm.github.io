<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💗 이름 궁합 테스트</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, "Noto Sans KR", sans-serif;
            background: linear-gradient(135deg, #fff5f8, #ffffff);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #444;
        }

        .container {
            width: 90%;
            max-width: 430px;
            background: white;
            border-radius: 25px;
            padding: 35px 25px;
            text-align: center;
            box-shadow: 0 10px 35px rgba(255, 120, 160, 0.18);
        }

        .heart {
            font-size: 55px;
            animation: heartbeat 1.3s infinite;
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.15);
            }
        }

        h1 {
            margin: 10px 0 8px;
            color: #ff5c91;
            font-size: 28px;
        }

        .description {
            color: #999;
            margin-bottom: 28px;
        }

        input {
            width: 100%;
            padding: 15px;
            margin: 7px 0;
            border: 2px solid #ffd1df;
            border-radius: 13px;
            outline: none;
            font-size: 16px;
            transition: 0.2s;
        }

        input:focus {
            border-color: #ff7da8;
            box-shadow: 0 0 0 4px #fff0f5;
        }

        button {
            width: 100%;
            margin-top: 15px;
            padding: 15px;
            border: none;
            border-radius: 13px;
            background: linear-gradient(135deg, #ff6f9f, #ff91b5);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 18px rgba(255, 100, 150, 0.25);
        }

        button:active {
            transform: scale(0.98);
        }

        #result {
            display: none;
            margin-top: 30px;
            padding: 25px 15px;
            background: #fff6f9;
            border-radius: 20px;
        }

        .names {
            font-size: 18px;
            color: #777;
        }

        .score {
            font-size: 65px;
            font-weight: bold;
            color: #ff4f89;
            margin: 8px 0;
        }

        .percent {
            font-size: 25px;
        }

        .message {
            font-size: 19px;
            font-weight: bold;
            color: #ff5c91;
            margin-top: 10px;
        }

        .small {
            font-size: 12px;
            color: #bbb;
            margin-top: 22px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="heart">💗</div>

    <h1>이름 궁합 테스트</h1>

    <div class="description">
        두 사람의 이름을 입력해보세요!
    </div>

    <input type="text" id="name1" placeholder="첫 번째 이름">
    <input type="text" id="name2" placeholder="두 번째 이름">

    <button onclick="checkCompatibility()">
        💕 궁합 확인하기
    </button>

    <div id="result">
        <div class="names" id="names"></div>

        <div class="score">
            <span id="score">100</span><span class="percent">%</span>
        </div>

        <div class="message" id="message">
            💕 천생연분이에요!
        </div>
    </div>

    <div class="small">
        ※ 재미로 보는 이름 궁합 테스트입니다.
    </div>

</div>

<script>
function checkCompatibility() {

    const name1 = document.getElementById("name1").value.trim();
    const name2 = document.getElementById("name2").value.trim();

    if (name1 === "" || name2 === "") {
        alert("두 사람의 이름을 모두 입력해주세요! 💗");
        return;
    }

    /*
        궁합 점수:
        무조건 90 ~ 100 사이에서 랜덤으로 결정
    */
    const score = Math.floor(Math.random() * 11) + 90;

    document.getElementById("names").textContent =
        name1 + " ❤️ " + name2;

    document.getElementById("score").textContent = score;

    let message;

    if (score >= 98) {
        message = "💖 운명적인 천생연분!";
    } else if (score >= 95) {
        message = "💕 정말 잘 어울리는 사이!";
    } else if (score >= 92) {
        message = "💗 서로에게 좋은 인연이에요!";
    } else {
        message = "💓 꽤 잘 어울리는 사이!";
    }

    document.getElementById("message").textContent = message;

    document.getElementById("result").style.display = "block";
}
</script>

</body>
</html>
